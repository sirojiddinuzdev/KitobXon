name: KitobXon Deploy to Server

on:
  workflow_run:
    workflows: ["KitobXon CI Tests"]
    types:
      - completed
    branches: [ main, master ]

jobs:
  deploy:
    name: Avtomatik Tarqatish (Deploy)
    runs-on: ubuntu-latest
    # Faqat CI testlari muvaffaqiyatli o'tganda deploy qilinadi
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Serverga ulanish va kodni yangilash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1. Loyiha papkasiga kirish
            cd ${{ secrets.PROJECT_PATH }}

            # 2. Yangi kodlarni GitHub'dan yuklab olish
            git pull origin main

            # 3. Docker containerlarni yangi kod bilan qayta qurish
            docker compose pull
            docker compose up -d --build --remove-orphans

            # 4. Ma'lumotlar bazasi migratsiyalarini bajarish
            docker compose exec -T web python manage.py migrate --noinput

            # 5. Statik fayllarni yig'ish
            docker compose exec -T web python manage.py collectstatic --noinput

            # 6. Eski Docker qatlam va rasm chiqindilarini tozalash
            docker image prune -f

            echo "✅ Deploy muvaffaqiyatli yakunlandi! ($(date))"
