name: KitobXon CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Testlar va Xavfsizlik Tekshiruvi (PostgreSQL + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: kitobxon_test
          POSTGRES_USER: kitobxon_user
          POSTGRES_PASSWORD: kitobxon_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-key-aaabbbcccdddeeefffggghhhiiijjjkkklllmmmnnn12345678' }}
      DEBUG: "True"
      POSTGRES_DB: kitobxon_test
      POSTGRES_USER: kitobxon_user
      POSTGRES_PASSWORD: kitobxon_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SECURE_SSL_REDIRECT: "False"

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.13 sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migration drift tekshiruvi
        run: |
          python manage.py migrate --run-syncdb
          python manage.py makemigrations --check --dry-run

      - name: Production xavfsizlik tekshiruvi (check --deploy)
        env:
          DEBUG: "False"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-deploy-check-aaabbbcccdddeeefffggghhhiiijjjkkklllmmmnnnoooppp123' }}
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py check --deploy --fail-level CRITICAL

      - name: Barcha testlarni ishga tushirish (PostgreSQL bilan)
        run: |
          python manage.py test --verbosity=2
